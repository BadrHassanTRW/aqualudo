<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الحجوزات · أكوا لودو</title>
  <link rel="icon" href="../assets/img/brand/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'" fetchpriority="low">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <script src="../assets/js/i18n.js"></script>
</head>
<body class="loading">
  <div id="splash-root"></div>
  <div id="adm-page-wrap">
    <div class="admin-page-head">
      <div>
        <span class="eyebrow">كل الحجوزات</span>
        <h1>الحجوزات</h1>
        <p>أكّد، ألغِ، أو ضيف حجز جديد (واتساب أو تليفون).</p>
      </div>
      <div class="actions">
        <button id="toggleAdd" class="btn btn-primary">+ ضيف حجز</button>
      </div>
    </div>

    <div class="tab-bar">
      <button class="tab active" data-filter="all">الكل</button>
      <button class="tab" data-filter="pending">معلقة</button>
      <button class="tab" data-filter="confirmed">مؤكدة</button>
      <button class="tab" data-filter="cancelled">ملغية</button>
      <button class="tab" data-filter="today">النهاردة</button>
    </div>

    <div id="addForm" style="display: none; margin-bottom: 24px;">
      <div class="admin-card">
        <h2>حجز جديد</h2>
        <form id="newBooking" class="admin-form">
          <div class="form-row three">
            <div class="field"><label>اسم العميل</label><input type="text" id="nb-name" required /></div>
            <div class="field"><label>الموبايل</label><input type="tel" id="nb-phone" required placeholder="+20..." /></div>
            <div class="field"><label>النشاط</label>
              <select id="nb-activity" required><option value="">اختار</option></select>
            </div>
          </div>
          <div class="form-row three">
            <div class="field"><label>الموعد</label><input type="datetime-local" id="nb-when" required /></div>
            <div class="field"><label>عدد الناس</label>
              <select id="nb-size"><option>1</option><option>2</option><option>3</option><option>4</option></select>
            </div>
            <div class="field"><label>الدفع</label>
              <select id="nb-payment"><option value="unpaid">مش مدفوع</option><option value="deposit_paid">عربون</option><option value="paid">مدفوع</option></select>
            </div>
          </div>
          <div class="field"><label>ملاحظات</label><textarea id="nb-notes"></textarea></div>
          <div class="form-actions">
            <button type="button" id="cancelAdd" class="btn btn-ghost">إلغاء</button>
            <button type="submit" class="btn btn-primary">احفظ الحجز</button>
          </div>
        </form>
      </div>
    </div>

    <div class="admin-table-wrap responsive">
      <table class="admin-table" id="bookingsTable">
        <thead>
          <tr>
            <th>العميل</th>
            <th>النشاط</th>
            <th>الموعد</th>
            <th>عدد</th>
            <th>الدفع</th>
            <th>الحالة</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <script src="../assets/js/db.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/export-excel.js"></script>
  <script>
    if (typeof AquaDB !== 'undefined' && AquaDB.admin && !AquaDB.admin.isAuth()) {
      location.href = 'login.html';
    }
    document.getElementById('splash-root').innerHTML = Aqua.renderSplash();
    document.body.classList.add('loading');
    Aqua.runSplash();
    const wrap = document.getElementById('adm-page-wrap');
    const pageContent = wrap.innerHTML;
    const root = document.createElement('div');
    root.id = 'admin-shell-root';
    wrap.parentNode.replaceChild(root, wrap);
    root.innerHTML = Aqua.renderAdminShell();
    document.getElementById('admMain').innerHTML = pageContent;
    Aqua.bindAdminShell();
    const quick = document.getElementById('admQuick');
    if (quick) {
      quick.innerHTML = `
        <a class="btn btn-ghost" href="bookings.html">الحجوزات</a>
        <a class="btn btn-ghost" href="activities.html">الأنشطة</a>
        <a class="btn btn-ghost" href="contacts.html">الرسايل</a>
        <button class="btn btn-primary" type="button" data-qb="1">+ حجز جديد</button>
      `;
    }
    Aqua.bindGlobal();
    Aqua.bindActivityQuickView();

    let filter = 'all';
    const acts = AquaDB.activities.active();
    const actSel = document.getElementById('nb-activity');
    acts.forEach(a => { const o = document.createElement('option'); o.value = a.id; o.textContent = a.name; actSel.appendChild(o); });

    document.getElementById('toggleAdd').addEventListener('click', () => { document.getElementById('addForm').style.display = document.getElementById('addForm').style.display === 'none' ? 'block' : 'none'; });
    document.getElementById('cancelAdd').addEventListener('click', () => { document.getElementById('addForm').style.display = 'none'; });

    document.querySelectorAll('.tab-bar .tab').forEach(t => {
      t.addEventListener('click', () => {
        document.querySelectorAll('.tab-bar .tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        filter = t.dataset.filter;
        render();
      });
    });

    document.getElementById('newBooking').addEventListener('submit', (e) => {
      e.preventDefault();
      const data = {
        name: document.getElementById('nb-name').value.trim(),
        phone: document.getElementById('nb-phone').value.trim(),
        activityId: actSel.value,
        startAt: new Date(document.getElementById('nb-when').value).toISOString(),
        partySize: parseInt(document.getElementById('nb-size').value) || 1,
        payment: document.getElementById('nb-payment').value,
        notes: document.getElementById('nb-notes').value.trim(),
        status: 'confirmed',
      };
      if (!data.name || !data.phone || !data.activityId || !data.startAt) { Aqua.toast('املا كل الخانات', 'error'); return; }
      const customer = AquaDB.customers.findOrCreate({ name: data.name, phone: data.phone });
      data.customerId = customer.id;
      AquaDB.bookings.create(data);
      document.getElementById('newBooking').reset();
      document.getElementById('addForm').style.display = 'none';
      Aqua.toast('اتضاف الحجز', 'success');
      render();
    });

    function render() {
      const all = AquaDB.bookings.all();
      let list = all;
      const today = new Date(); today.setHours(0,0,0,0);
      const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate()+1);
      if (filter === 'pending') list = all.filter(b => b.status === 'pending');
      else if (filter === 'confirmed') list = all.filter(b => b.status === 'confirmed');
      else if (filter === 'cancelled') list = all.filter(b => b.status === 'cancelled');
      else if (filter === 'today') list = all.filter(b => new Date(b.startAt) >= today && new Date(b.startAt) < tomorrow);

      const tbody = document.getElementById('tbody');
      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty"><h3>مفيش حجوزات هنا</h3><p class="muted">لما حد يحجز، هيظهر هنا.</p></td></tr>`;
        return;
      }
      tbody.innerHTML = list.map(b => {
        const a = AquaDB.activities.getById(b.activityId);
        const d = new Date(b.startAt);
        const date = d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' });
        const time = d.toLocaleTimeString('ar-EG', { hour: 'numeric', minute: '2-digit' });
        const status = b.status === 'confirmed' ? '<span class="badge badge-confirmed">مؤكدة</span>' : b.status === 'cancelled' ? '<span class="badge badge-cancelled">ملغية</span>' : '<span class="badge badge-pending">معلقة</span>';
        const pay = b.payment === 'paid' ? '<span class="badge badge-paid">مدفوع</span>' : b.payment === 'deposit_paid' ? '<span class="badge badge-deposit">عربون</span>' : b.payment === 'refunded' ? '<span class="badge badge-refunded">مرتجع</span>' : '<span class="badge badge-unpaid">غير مدفوع</span>';
        const phone = (b.phone || '').replace(/[^0-9+]/g, '');
        const waMsg = encodeURIComponent(`أهلاً ${b.name}، حجزك في ${a ? a.name : 'أكوا لودو'} يوم ${d.toLocaleDateString('ar-EG')} الساعة ${time} ${b.status === 'confirmed' ? 'مؤكد ✅' : 'قيد التأكيد'}.`);
        const rowClass = b.status === 'cancelled' ? 'cancelled' : '';
        return `
          <tr class="${rowClass}">
            <td data-label="العميل">
              <strong>${b.name}</strong><br>
              <small class="muted" style="direction: ltr; display: inline-block;">${b.phone}</small>
            </td>
            <td data-label="النشاط">${a ? a.name : '—'}</td>
            <td data-label="الموعد">${date}<br><small class="muted">${time}</small></td>
            <td data-label="عدد">${b.partySize || 1}</td>
            <td data-label="الدفع">${pay}</td>
            <td data-label="الحالة">${status}</td>
            <td>
              <div class="row-actions">
                <a href="https://wa.me/${phone}?text=${waMsg}" target="_blank" rel="noopener" class="btn btn-sm btn-success" title="واتساب">💬</a>
                ${b.status === 'pending' ? `<button class="btn btn-sm btn-success" data-confirm="${b.id}">تأكيد</button>` : ''}
                ${b.status !== 'cancelled' ? `<button class="btn btn-sm btn-danger" data-cancel="${b.id}">إلغاء</button>` : ''}
              </div>
            </td>
          </tr>
        `;
      }).join('');

      tbody.querySelectorAll('[data-confirm]').forEach(btn => {
        btn.addEventListener('click', () => {
          AquaDB.bookings.confirm(btn.dataset.confirm);
          Aqua.toast('اتأكدت', 'success');
          render();
        });
      });
      tbody.querySelectorAll('[data-cancel]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (!confirm('متأكد عايز تلغي الحجز ده؟')) return;
          AquaDB.bookings.cancel(btn.dataset.cancel);
          Aqua.toast('اتلغى', 'success');
          render();
        });
      });
    }
    render();
  </script>
</body>
</html>
