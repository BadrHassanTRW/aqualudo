<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff sign-in · Aqua Ludo</title>
  <link rel="icon" href="../../assets/img/brand/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'" fetchpriority="low">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <script src="../../assets/js/i18n.js"></script>
</head>
<body class="loading">
  <div id="splash-root"></div>
  <div id="header-root"></div>

  <section class="section-pad" style="padding-top: 140px;">
    <div class="container" style="max-width: 460px;">
      <div class="text-center reveal" style="margin-bottom: 30px;">
        <div style="width: 80px; height: 80px; background: var(--ink); color: #fff; border-radius: 24px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 2rem;">
          🔒
        </div>
        <span class="eyebrow">Dashboard</span>
        <h1 class="display page-title" style="margin-top: 14px;">Staff sign-in</h1>
        <p class="lede" style="margin-top: 14px;">This page is for academy staff only.</p>
      </div>

      <form class="form-shell reveal" id="loginForm">
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••" />
        </div>
        <div id="error" style="display: none; color: var(--red); font-size: 0.9rem; margin-bottom: 12px; font-weight: 700;">Wrong password. Try again.</div>
        <div class="form-actions">
          <a href="../../en/index.html" class="btn btn-ghost">Back</a>
          <button type="submit" class="btn btn-primary btn-arrow">Sign in</button>
        </div>
        <div style="margin-top: 20px; padding: 14px; background: #FEF3C7; color: #92400E; border-radius: 12px; font-size: 0.85rem; text-align: center;">
          <strong>Demo mode:</strong> the password is <code style="background: #fff; padding: 2px 8px; border-radius: 6px; font-weight: 800;">aqualudo2026</code>
        </div>
      </form>
    </div>
  </section>

  <div id="footer-root"></div>

  <script src="../../assets/js/db-en.js"></script>
  <script src="../../assets/js/db.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script>
    document.getElementById('splash-root').innerHTML = Aqua.renderSplash();
    document.getElementById('header-root').innerHTML = Aqua.renderHeader();
    document.getElementById('footer-root').innerHTML = Aqua.renderFooter();
    document.body.classList.add('loading');
    Aqua.runSplash();
    Aqua.bindHeader();
    Aqua.reveal();

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const pw = document.getElementById('password').value;
      if (AquaDB.admin.login(pw)) {
        Aqua.toast('Welcome back', 'success');
        setTimeout(() => location.href = 'index.html', 500);
      } else {
        document.getElementById('error').style.display = 'block';
        Aqua.toast('Wrong password', 'error');
      }
    });
  </script>
</body>
</html>
