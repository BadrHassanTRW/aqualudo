<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · Aqua Ludo</title>
  <link rel="icon" href="../../assets/img/brand/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'" fetchpriority="low">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <script src="../../assets/js/i18n.js"></script>
</head>
<body class="loading">
  <div id="splash-root"></div>
  <div id="header-root"></div>

  <section class="section-pad" style="padding-top: 140px;">
    <div class="container" style="max-width: 500px;">
      <div class="text-center reveal" style="margin-bottom: 30px;">
        <span class="eyebrow">Sign in</span>
        <h1 class="display page-title" style="margin-top: 14px;">Welcome back.</h1>
        <p class="lede" style="margin-top: 14px;">Enter your email and we'll send you a code right away. No password, no fuss.</p>
      </div>

      <div class="qa-stack" style="margin-top: 20px; justify-content: center;">
        <a href="booking.html" class="qa-chip">+ Book a session without signing up</a>
        <a href="activities.html" class="qa-chip">Browse activities</a>
      </div>

      <div class="form-shell reveal" id="step1">
        <div class="field">
          <label for="email">Your email</label>
          <input type="email" id="email" placeholder="example@gmail.com" required />
          <small class="muted" style="display: block; margin-top: 8px;">We'll send the code to this email right away.</small>
        </div>
        <div class="form-actions">
          <a href="../../en/index.html" class="btn btn-ghost">Back</a>
          <button id="sendCode" class="btn btn-primary btn-arrow">Send me the code</button>
        </div>
      </div>

      <div class="form-shell reveal" id="step2" style="display: none;">
        <div class="text-center" style="margin-bottom: 20px;">
          <div style="width: 64px; height: 64px; background: var(--coral); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </div>
          <h3 class="display" style="font-size: 1.5rem; margin-bottom: 8px;">Enter the code</h3>
          <p class="muted">We sent a 6-digit code to <strong id="emailShow"></strong></p>
        </div>
        <div id="devHint" style="background: #FEF3C7; color: #92400E; padding: 12px 16px; border-radius: 12px; font-size: 0.9rem; margin-bottom: 16px; text-align: center;">
          <strong>Demo mode:</strong> the code is <code id="devCode" style="background: #fff; padding: 2px 8px; border-radius: 6px; font-weight: 800;"></code>
        </div>
        <div class="field">
          <label for="code">Code</label>
          <input type="text" id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456" style="text-align: center; font-size: 1.5rem; letter-spacing: 0.3em; font-weight: 800;" required />
        </div>
        <div class="form-actions">
          <button id="back" class="btn btn-ghost">I changed my email</button>
          <button id="verify" class="btn btn-primary btn-arrow">Sign in</button>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-root"></div>

  <script src="../../assets/js/db-en.js"></script>
  <script src="../../assets/js/db.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script>
    document.getElementById('splash-root').innerHTML = Aqua.renderSplash();
    document.getElementById('header-root').innerHTML = Aqua.renderHeader();
    document.getElementById('footer-root').innerHTML = Aqua.renderFooter();
    document.body.classList.add('loading');
    Aqua.runSplash();
    Aqua.bindHeader();
    Aqua.reveal();

    let pendingEmail = '';

    document.getElementById('sendCode').addEventListener('click', () => {
      const email = document.getElementById('email').value.trim();
      if (!email || !email.includes('@')) { Aqua.toast('Enter a valid email', 'error'); return; }
      pendingEmail = email;
      const code = AquaDB.authCodes.create(email);
      document.getElementById('emailShow').textContent = email;
      document.getElementById('devCode').textContent = code;
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
      document.getElementById('code').focus();
    });

    document.getElementById('back').addEventListener('click', () => {
      document.getElementById('step1').style.display = 'block';
      document.getElementById('step2').style.display = 'none';
    });

    document.getElementById('verify').addEventListener('click', () => {
      const code = document.getElementById('code').value.trim();
      if (!code) { Aqua.toast('Enter the code', 'error'); return; }
      if (!AquaDB.authCodes.verify(pendingEmail, code)) { Aqua.toast('Wrong or expired code', 'error'); return; }
      const customer = AquaDB.customers.findOrCreate({ email: pendingEmail });
      AquaDB.session.set(customer.id);
      Aqua.toast('Welcome!', 'success');
      setTimeout(() => location.href = 'account.html', 600);
    });
  </script>
</body>
</html>
