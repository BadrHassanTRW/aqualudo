<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activities · Control panel</title>
  <link rel="icon" href="../../assets/img/brand/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'" fetchpriority="low">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <script src="../../assets/js/i18n.js"></script>
</head>
<body class="loading">
  <div id="splash-root"></div>
  <div id="adm-page-wrap">
    <div class="admin-page-head">
      <div>
        <span class="eyebrow">All activities</span>
        <h1>Activities</h1>
        <p>Edit, add, or archive the activities shown on the site.</p>
      </div>
      <div class="actions">
        <button id="toggleAdd" class="btn btn-primary">+ New activity</button>
      </div>
    </div>

    <div id="addForm" style="display: none; margin-bottom: 24px;">
      <div class="admin-card">
        <h2>New activity</h2>
        <form id="newAct" class="admin-form">
          <div class="form-row">
            <div class="field"><label>Name (Arabic)</label><input type="text" id="na-name" required /></div>
            <div class="field"><label>Slug (Arabic in the link)</label><input type="text" id="na-slug" required placeholder="e.g. rowing" /></div>
          </div>
          <div class="form-row">
            <div class="field"><label>Tagline</label><input type="text" id="na-tagline" required placeholder="A short, catchy line" /></div>
            <div class="field"><label>Image link</label><input type="url" id="na-hero" required placeholder="https://..." /></div>
          </div>
          <div class="form-row three">
            <div class="field"><label>Price (EGP)</label><input type="number" id="na-price" required min="0" /></div>
            <div class="field"><label>Duration</label><input type="text" id="na-duration" required value="hour" /></div>
            <div class="field"><label>Display number</label><input type="text" id="na-number" required placeholder="06" /></div>
          </div>
          <div class="field"><label>Description</label><textarea id="na-long" required></textarea></div>
          <div class="form-actions">
            <button type="button" id="cancelAdd" class="btn btn-ghost">Cancel</button>
            <button type="submit" class="btn btn-primary">Save activity</button>
          </div>
        </form>
      </div>
    </div>

    <div id="editForm" style="display: none; margin-bottom: 24px;"></div>

    <div id="list"></div>
  </div>

  <script src="../../assets/js/db-en.js"></script>
  <script src="../../assets/js/db.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script>
    if (typeof AquaDB !== 'undefined' && AquaDB.admin && !AquaDB.admin.isAuth()) {
      location.href = 'login.html';
    }
    document.getElementById('splash-root').innerHTML = Aqua.renderSplash();
    document.body.classList.add('loading');
    Aqua.runSplash();
    const wrap = document.getElementById('adm-page-wrap');
    const pageContent = wrap.innerHTML;
    const root = document.createElement('div');
    root.id = 'admin-shell-root';
    wrap.parentNode.replaceChild(root, wrap);
    root.innerHTML = Aqua.renderAdminShell();
    document.getElementById('admMain').innerHTML = pageContent;
    Aqua.bindAdminShell();
    const quick = document.getElementById('admQuick');
    if (quick) {
      quick.innerHTML = `
        <a class="btn btn-ghost" href="bookings.html">Bookings</a>
        <a class="btn btn-ghost" href="activities.html">Activities</a>
        <a class="btn btn-ghost" href="contacts.html">Messages</a>
        <button class="btn btn-primary" type="button" data-qb="1">+ New booking</button>
      `;
    }
    Aqua.bindGlobal();
    Aqua.bindActivityQuickView();

    document.getElementById('toggleAdd').addEventListener('click', () => {
      document.getElementById('addForm').style.display = document.getElementById('addForm').style.display === 'none' ? 'block' : 'none';
    });
    document.getElementById('cancelAdd').addEventListener('click', () => { document.getElementById('addForm').style.display = 'none'; });

    document.getElementById('newAct').addEventListener('submit', (e) => {
      e.preventDefault();
      const data = {
        name: document.getElementById('na-name').value.trim(),
        slug: document.getElementById('na-slug').value.trim().toLowerCase(),
        tagline: document.getElementById('na-tagline').value.trim(),
        hero: document.getElementById('na-hero').value.trim(),
        long: document.getElementById('na-long').value.trim(),
        number: document.getElementById('na-number').value.trim(),
        pricing: [{ name: 'Standard', desc: 'One-hour session', price: parseInt(document.getElementById('na-price').value) || 0, duration: document.getElementById('na-duration').value.trim() }],
        included: ['All gear', 'Coach with you'],
        bring: ['Swimwear', 'Sunscreen'],
      };
      if (!data.name || !data.slug) { Aqua.toast('Enter the name and slug', 'error'); return; }
      AquaDB.activities.create(data);
      document.getElementById('newAct').reset();
      document.getElementById('addForm').style.display = 'none';
      Aqua.toast('Activity added', 'success');
      render();
    });

    function render() {
      const all = AquaDB.activities.all();
      const list = document.getElementById('list');
      if (all.length === 0) {
        list.innerHTML = '<div class="timeline-tile text-center"><h3 class="display" style="margin-bottom:8px;">No activities</h3></div>';
        return;
      }
      list.innerHTML = all.map(a => {
        const minPrice = a.pricing && a.pricing[0] ? a.pricing[0].price : 0;
        const sched = AquaDB.schedules.for(a.id);
        return `
          <div class="activity-row">
            <div class="left">
              <div class="thumb" style="background-image: url('${a.hero}')"></div>
              <div class="info">
                <h3>${a.name} <span style="color: var(--coral); font-weight: 800; font-size: 0.8rem;">${a.active ? 'Active' : 'Archived'}</span></h3>
                <p>${a.tagline} · ${sched.length} weekly slots · from ${minPrice} EGP</p>
              </div>
            </div>
            <div class="right">
              ${a.active ? `<button class="btn btn-sm btn-ghost" data-archive="${a.id}">Archive</button>` : `<button class="btn btn-sm btn-success" data-restore="${a.id}">Restore</button>`}
              <button class="btn btn-sm btn-ghost" data-edit="${a.id}">Edit</button>
              <a href="../pages/activity.html?slug=${a.slug}" target="_blank" class="btn btn-sm btn-light">View</a>
            </div>
          </div>
        `;
      }).join('');

      list.querySelectorAll('[data-archive]').forEach(b => b.addEventListener('click', () => { AquaDB.activities.archive(b.dataset.archive); Aqua.toast('Archived', 'success'); render(); }));
      list.querySelectorAll('[data-restore]').forEach(b => b.addEventListener('click', () => { AquaDB.activities.update(b.dataset.restore, { active: true }); Aqua.toast('Restored', 'success'); render(); }));
      list.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openEdit(b.dataset.edit)));
    }

    function openEdit(id) {
      const a = AquaDB.activities.getById(id);
      if (!a) return;
      const sched = AquaDB.schedules.for(id);
      const form = document.getElementById('editForm');
      form.style.display = 'block';
      form.innerHTML = `
        <div class="admin-card">
          <h2>Edit: ${a.name}</h2>
          <form id="editAct" class="admin-form">
            <div class="form-row">
              <div class="field"><label>Name</label><input type="text" id="e-name" value="${a.name}" required /></div>
              <div class="field"><label>Tagline</label><input type="text" id="e-tagline" value="${a.tagline}" required /></div>
            </div>
            <div class="form-row">
              <div class="field"><label>Image link</label><input type="url" id="e-hero" value="${a.hero}" required /></div>
              <div class="field"><label>Base price (EGP)</label><input type="number" id="e-price" value="${a.pricing[0] ? a.pricing[0].price : 0}" required min="0" /></div>
            </div>
            <div class="field"><label>Description</label><textarea id="e-long" required>${a.long}</textarea></div>
            <h3>Weekly schedule</h3>
            <div id="slots"></div>
            <button type="button" id="addSlot" class="btn btn-sm btn-ghost" style="margin-top: 8px;">+ Add slot</button>
            <div class="form-actions" style="margin-top: 24px;">
              <button type="button" id="cancelEdit" class="btn btn-ghost">Cancel</button>
              <button type="submit" class="btn btn-primary">Save changes</button>
            </div>
          </form>
        </div>
      `;
      form.scrollIntoView({ behavior: 'smooth' });

      const slotsEl = document.getElementById('slots');
      function renderSlots() {
        slotsEl.innerHTML = sched.map((s, i) => `
          <div class="schedule-slot">
            <div class="field">
              <label>Day</label>
              <select data-slot-idx="${i}" data-slot-field="day">
                ${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map((d, di) => `<option value="${di}" ${di === s.day ? 'selected' : ''}>${d}</option>`).join('')}
              </select>
            </div>
            <div class="field"><label>From</label><input type="time" value="${s.start}" data-slot-idx="${i}" data-slot-field="start" /></div>
            <div class="field"><label>To</label><input type="time" value="${s.end}" data-slot-idx="${i}" data-slot-field="end" /></div>
            <div class="field"><label>Capacity</label><input type="number" min="1" value="${s.capacity}" data-slot-idx="${i}" data-slot-field="capacity" /></div>
            <button type="button" class="btn btn-sm btn-danger" data-rm="${i}">Delete</button>
          </div>
        `).join('');
        slotsEl.querySelectorAll('[data-slot-idx]').forEach(inp => {
          inp.addEventListener('change', () => {
            const i = +inp.dataset.slotIdx;
            const f = inp.dataset.slotField;
            sched[i][f] = f === 'day' || f === 'capacity' ? +inp.value : inp.value;
          });
        });
        slotsEl.querySelectorAll('[data-rm]').forEach(btn => {
          btn.addEventListener('click', () => { sched.splice(+btn.dataset.rm, 1); renderSlots(); });
        });
      }
      renderSlots();
      document.getElementById('addSlot').addEventListener('click', () => { sched.push({ day: 0, start: '09:00', end: '10:00', capacity: 6 }); renderSlots(); });
      document.getElementById('cancelEdit').addEventListener('click', () => { form.style.display = 'none'; });

      document.getElementById('editAct').addEventListener('submit', (e) => {
        e.preventDefault();
        AquaDB.activities.update(id, {
          name: document.getElementById('e-name').value.trim(),
          tagline: document.getElementById('e-tagline').value.trim(),
          hero: document.getElementById('e-hero').value.trim(),
          long: document.getElementById('e-long').value.trim(),
          pricing: [{ name: a.pricing[0] ? a.pricing[0].name : 'Standard', desc: a.pricing[0] ? a.pricing[0].desc : 'One-hour session', price: parseInt(document.getElementById('e-price').value) || 0, duration: a.pricing[0] ? a.pricing[0].duration : 'hour' }],
        });
        AquaDB.schedules.set(id, sched);
        Aqua.toast('Saved', 'success');
        form.style.display = 'none';
        render();
      });
    }

    render();
  </script>
</body>
</html>
