<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact messages · Control panel</title>
  <link rel="icon" href="../../assets/img/brand/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'" fetchpriority="low">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <script src="../../assets/js/i18n.js"></script>
</head>
<body class="loading">
  <div id="splash-root"></div>
  <div id="adm-page-wrap">
    <div class="admin-page-head">
      <div>
        <span class="eyebrow">Contact form</span>
        <h1>Contact messages</h1>
        <p>All the messages you receive from the "Contact" page on the site.</p>
      </div>
    </div>

    <div id="list"></div>
  </div>

  <script src="../../assets/js/db-en.js"></script>
  <script src="../../assets/js/db.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script>
    if (typeof AquaDB !== 'undefined' && AquaDB.admin && !AquaDB.admin.isAuth()) {
      location.href = 'login.html';
    }
    document.getElementById('splash-root').innerHTML = Aqua.renderSplash();
    document.body.classList.add('loading');
    Aqua.runSplash();
    const wrap = document.getElementById('adm-page-wrap');
    const pageContent = wrap.innerHTML;
    const root = document.createElement('div');
    root.id = 'admin-shell-root';
    wrap.parentNode.replaceChild(root, wrap);
    root.innerHTML = Aqua.renderAdminShell();
    document.getElementById('admMain').innerHTML = pageContent;
    Aqua.bindAdminShell();
    const quick = document.getElementById('admQuick');
    if (quick) {
      quick.innerHTML = `
        <a class="btn btn-ghost" href="bookings.html">Bookings</a>
        <a class="btn btn-ghost" href="activities.html">Activities</a>
        <a class="btn btn-ghost" href="contacts.html">Messages</a>
        <button class="btn btn-primary" type="button" data-qb="1">+ New booking</button>
      `;
    }
    Aqua.bindGlobal();
    Aqua.bindActivityQuickView();

    function render() {
      const list = AquaDB.contact.all();
      const el = document.getElementById('list');
      if (list.length === 0) {
        el.innerHTML = '<div class="timeline-tile text-center"><h3 class="display" style="margin-bottom:8px;">No messages yet</h3><p class="muted">When someone sends from the site, they will show up here.</p></div>';
        return;
      }
      el.innerHTML = list.map(c => `
        <div class="dashboard-card">
          <div style="display: flex; justify-content: space-between; align-items: start; gap: 16px; flex-wrap: wrap; margin-bottom: 12px;">
            <div>
              <h2 class="display" style="font-size: 1.3rem; color: var(--ink);">${c.name}</h2>
              <p class="muted" style="font-size: 0.9rem;">${c.email} · ${new Date(c.createdAt).toLocaleString('en-GB')}</p>
            </div>
            <span class="badge badge-deposit">${c.subject || 'Inquiry'}</span>
          </div>
          <p style="color: var(--ink); line-height: 1.7;">${c.message}</p>
          <div style="display: flex; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line-soft);">
            <a href="mailto:${c.email}?subject=Re: ${encodeURIComponent(c.subject || '')}" class="btn btn-sm btn-primary">Reply by email</a>
          </div>
        </div>
      `).join('');
    }
    render();
  </script>
</body>
</html>
