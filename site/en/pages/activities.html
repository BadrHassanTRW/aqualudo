<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activities · Aqua Ludo</title>
  <link rel="icon" href="../../assets/img/brand/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'" fetchpriority="low">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <script src="../../assets/js/i18n.js"></script>
</head>
<body class="loading">
  <div id="splash-root"></div>
  <div id="header-root"></div>

  <section class="hero-sm">
    <div class="container">
      <div class="crumbs"><a href="../../en/index.html">Home</a> · Activities</div>
      <span class="eyebrow">All the water sports</span>
      <h1>Five sports.<br />One water, one team.</h1>
      <p>Pick your sport and book your first session. No experience needed — all the gear is on us, and every session runs with a dedicated coach on the water.</p>
    </div>
  </section>

  <section class="section-pad">
    <div class="container">
      <div class="section-head reveal" style="margin-bottom: 28px;">
        <div class="left">
          <span class="eyebrow">Quick filter</span>
          <h2 class="display" style="font-size: clamp(1.6rem, 3vw, 2.4rem);">Choose your sport.</h2>
        </div>
        <div class="row" style="gap: 10px;">
          <button type="button" data-qb="1" class="btn btn-primary">+ Book a session</button>
        </div>
      </div>

      <div class="filter-pills reveal" id="filterPills">
        <button type="button" class="filter-pill active" data-slug-filter="all">All</button>
        <button type="button" class="filter-pill" data-slug-filter="rowing">Rowing</button>
        <button type="button" class="filter-pill" data-slug-filter="kayaking">Kayaking</button>
        <button type="button" class="filter-pill" data-slug-filter="sup">SUP</button>
        <button type="button" class="filter-pill" data-slug-filter="wake">Wakeboard</button>
        <button type="button" class="filter-pill" data-slug-filter="fit">Fitness</button>
      </div>

      <div class="activities-grid" id="grid"></div>
    </div>
  </section>

  <div id="footer-root"></div>

  <script src="../../assets/js/db-en.js"></script>
  <script src="../../assets/js/db.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script>
    document.getElementById('splash-root').innerHTML = Aqua.renderSplash();
    document.getElementById('header-root').innerHTML = Aqua.renderHeader('activities');
    document.getElementById('footer-root').innerHTML = Aqua.renderFooter();
    document.body.classList.add('loading');
    Aqua.runSplash();
    Aqua.bindHeader();
    Aqua.reveal();

    document.getElementById('grid').innerHTML = AquaDB.activities.active().map((a, i) => `
      <a class="activity-card ${i === 0 ? 'large' : 'small'} reveal" href="activity.html?slug=${a.slug}" data-slug="${a.slug}">
        <img src="${a.hero}" alt="${a.name}" loading="${i === 0 ? 'eager' : 'lazy'}" ${i === 0 ? 'fetchpriority="high"' : ''} />
        <div class="overlay"></div>
        <div class="meta">
          <div class="num">${a.number} — ${a.name}</div>
          <h3 class="card-title display">${a.tagline}</h3>
          <div class="price">From ${a.pricing[0].price} EGP / ${a.pricing[0].duration}</div>
        </div>
      </a>
    `).join('');

    Aqua.bindActivityQuickView();
    Aqua.reveal();

    (function bindFilters() {
      const pills = document.querySelectorAll('#filterPills .filter-pill');
      const grid = document.getElementById('grid');
      pills.forEach(pill => {
        pill.addEventListener('click', () => {
          pills.forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          const filter = pill.getAttribute('data-slug-filter');
          grid.querySelectorAll('.activity-card').forEach(card => {
            const slug = card.getAttribute('data-slug');
            const show = filter === 'all' || slug === filter;
            card.style.display = show ? '' : 'none';
          });
        });
      });
    })();
  </script>
</body>
</html>
