<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الأنشطة · أكوا لودو</title>
  <link rel="icon" href="../assets/img/boat.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body class="loading">
  <div id="splash-root"></div>
  <div id="header-root"></div>

  <section class="hero-sm">
    <div class="container">
      <div class="crumbs"><a href="../index.html">الرئيسية</a> · الأنشطة</div>
      <span class="eyebrow">كل الرياضات المائية</span>
      <h1>خمس رياضات.<br />مية واحدة وفريق واحد.</h1>
      <p>اختار رياضتك واحجز أول سيشن. مش محتاج خبرة، كل العدة علينا، وكل سيشن مع كوتش متخصص على المية.</p>
    </div>
  </section>

  <section class="section-pad">
    <div class="container">
      <div class="activities-grid" id="grid"></div>
    </div>
  </section>

  <div id="footer-root"></div>

  <script src="../assets/js/db.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    document.getElementById('splash-root').innerHTML = Aqua.renderSplash();
    document.getElementById('header-root').innerHTML = Aqua.renderHeader('activities');
    document.getElementById('footer-root').innerHTML = Aqua.renderFooter();
    document.body.classList.add('loading');
    Aqua.runSplash();
    Aqua.bindHeader();
    Aqua.reveal();

    document.getElementById('grid').innerHTML = AquaDB.activities.active().map((a, i) => `
      <a class="activity-card ${i === 0 ? 'large' : 'small'} reveal" href="activity.html?slug=${a.slug}">
        <img src="${a.hero}" alt="${a.name}" />
        <div class="overlay"></div>
        <div class="meta">
          <div class="num">${a.number} — ${a.name}</div>
          <h3 class="card-title display">${a.tagline}</h3>
          <div class="price">ابتداءً من ${a.pricing[0].price} جنيه / ${a.pricing[0].duration}</div>
        </div>
      </a>
    `).join('');
    Aqua.reveal();
  </script>
</body>
</html>
